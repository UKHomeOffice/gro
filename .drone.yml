---
kind: pipeline
name: default
type: kubernetes

environment:
  APP_NAME: certificate-enquiries
  PROD_ENV: gro-form
  STG_ENV: gro-form-stg
  UAT_ENV: gro-form-uat
  BRANCH_ENV: gro-form-branch
  PRODUCTION_URL: www.certificate-enquiries.homeoffice.gov.uk
  IMAGE_URL: quay.io/ukhomeofficedigital
  IMAGE_REPO: gro-form
  GIT_REPO: UKHomeOffice/gro
  HOF_CONFIG: hof-services-config/General_Registrars_Office
  NON_PROD_AVAILABILITY: Mon-Fri 08:00-23:00 Europe/London
  READY_FOR_TEST_DELAY: 20s
  NOTIFY_STUB: stub

include_default_branch: &include_default_branch
  include:
    - master

include_default_and_feature_branches: &include_default_and_feature_branches
  include:
    - master
    - feature/*
    - deps-*
    - deps/*
    - GRO-*

trigger:
  branch:
    <<: *include_default_and_feature_branches

trivy-client-image: &trivy-client-image
  pull: if-not-exists
  image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest

node_image_name: &node_image_name quay.io/ukhomeofficedigital/hof-nodejs:24.22.3_1-alpine@sha256:8533bcedc2dc86aceadaa8bab422931e8a33a81504c67247392eeffec6603cd5

node_image: &node_image
  pull: if-not-exists
  image: *node_image_name

linting: &linting
  <<: *node_image
  environment:
    NOTIFY_KEY: USE_MOCK
  commands:
    - yarn run test:lint

sonar_scanner: &sonar_scanner
  pull: if-not-exists
  image: quay.io/ukhomeofficedigital/sonar-scanner:latest
  commands:
    - sonar-scanner -Dproject.settings=./sonar-project.properties

integration_tests: &integration_tests
  <<: *node_image
  environment:
    NOTIFY_KEY: USE_MOCK
  commands:
    - yarn run test:integration

github_app_token_step: &github_app_token_step
  pull: if-not-exists
  image: alpine:3.21
  volumes:
    - name: dockersock
      path: /root/.dockersock
  commands:
    - apk add --no-cache bash curl jq openssl
    - bash bin/generate_github_app_token.sh

github_app_token_secrets_ukho: &github_app_token_secrets_ukho
  GITHUB_APP_ID:
    from_secret: hof_ukho_gh_app_id
  GITHUB_APP_PRIVATE_KEY:
    from_secret: hof_ukho_gh_app_pk
  GITHUB_APP_INSTALLATION_ID:
    from_secret: hof_ukho_gh_app_install_id

github_app_token_secrets_hof: &github_app_token_secrets_hof
  GITHUB_APP_ID:
    from_secret: HOF_GH_APP_ID
  GITHUB_APP_PRIVATE_KEY:
    from_secret: HOF_GH_APP_PK
  GITHUB_APP_INSTALLATION_ID:
    from_secret: HOF_GH_APP_INSTALL_ID

clone_repos_step: &clone_repos_step
  image: alpine/git
  volumes:
    - name: dockersock
      path: /root/.dockersock
  commands:
    - test -s "$CLONE_TOKEN_FILE" || (echo "$CLONE_TOKEN_MISSING_MESSAGE" && exit 1)
    - export GITHUB_TOKEN="$(cat "$CLONE_TOKEN_FILE")"
    - git clone https://x-access-token:$${GITHUB_TOKEN}@github.com/UKHomeOfficeForms/hof-services-config.git
    - if [ "${CLONE_REPOS_PRUNE:-false}" = "true" ]; then find hof-services-config/* | grep -v $HOF_CONFIG | grep -v 'infrastructure' | xargs rm -rf; fi
    - rm -f "$CLONE_TOKEN_FILE"

steps:
  - name: generate_github_app_token_for_clone
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_hof
      OUTPUT_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone.txt
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]

  - name: clone_repos
    <<: *clone_repos_step
    environment:
      CLONE_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone.txt
      CLONE_TOKEN_MISSING_MESSAGE: Missing GitHub App token file for clone step.
    commands:
      - test -s "$CLONE_TOKEN_FILE" || (echo "$CLONE_TOKEN_MISSING_MESSAGE" && exit 1)
      - export GITHUB_TOKEN="$(cat "$CLONE_TOKEN_FILE")"
      - git clone https://x-access-token:$${GITHUB_TOKEN}@github.com/UKHomeOfficeForms/hof-services-config.git
      - rm -f "$CLONE_TOKEN_FILE"
    when:
      branch:
        include:
        - master
        - feature/*
        - deps-*
        - deps/*
      event: [push, pull_request]
    depends_on:
      - generate_github_app_token_for_clone

  # Trivy Security Scannner for scanning OS related vulnerabilities in Base image of Dockerfile
  - name: scan_base_image_os
    <<: *trivy-client-image
    resources:
      limits:
        cpu: 1000
        memory: 1024Mi
    environment:
      IMAGE_NAME: *node_image_name
      SERVICE_URL: https://acp-trivy-helm.acp-trivy.svc.cluster.local:443
      SEVERITY: MEDIUM,HIGH,CRITICAL --dependency-tree
      FAIL_ON_DETECTION: true
      IGNORE_UNFIXED: false
      ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    volumes:
      - name: dockersock
        path: /root/.dockersock
    when:
      event: [push, pull_request]
    depends_on:
      - clone_repos

  - name: setup
    <<: *node_image
    environment:
      NOTIFY_KEY: USE_MOCK
    commands:
      - yarn install --frozen-lockfile
      - yarn run postinstall
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - clone_repos

  - name: linting
    <<: *linting
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - setup

  - name: sonar_scanner
    <<: *sonar_scanner
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]

  - name: integration_tests
    <<: *integration_tests
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - setup
      - linting

  - name: build_image
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind
    commands:
      - n=0; while [ "$n" -lt 60 ] && [ ! docker stats --no-stream ]; do n=$(( n + 1 )); sleep 1; done
      - docker build --no-cache -t $${IMAGE_REPO}:$${DRONE_COMMIT_SHA} .
    volumes:
      - name: dockersock
        path: /var/run
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - linting

  - name: image_to_quay
    pull: if-not-exists
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind
    environment:
      DOCKER_PASSWORD:
        from_secret: DOCKER_PASSWORD
    commands:
    - docker login -u="ukhomeofficedigital+drone" -p=$${DOCKER_PASSWORD} quay.io
    - docker tag $${IMAGE_REPO}:$${DRONE_COMMIT_SHA} $${IMAGE_URL}/$${IMAGE_REPO}:$${DRONE_COMMIT_SHA}
    - docker push $${IMAGE_URL}/$${IMAGE_REPO}:$${DRONE_COMMIT_SHA}
    when:
      branch: 
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - linting
      - build_image

  # Trivy Security Scanner for scanning nodejs packages in Yarn
  - name: scan_node_packages
    <<: *trivy-client-image
    resources:
      limits:
        cpu: 1000
        memory: 1024Mi
    environment:
      IMAGE_NAME: gro-form:${DRONE_COMMIT_SHA}
      SEVERITY: MEDIUM,HIGH,CRITICAL --dependency-tree
      FAIL_ON_DETECTION: true
      IGNORE_UNFIXED: false
      ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    volumes:
      - name: dockersock
        path: /root/.dockersock
    when:
      event: [push, pull_request]
    depends_on:
      - image_to_quay

  # Deploy to pull request UAT environment
  - name: deploy_to_branch
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      # NOTIFY_STUB: stub
      KUBE_SERVER:
        from_secret: kube_server_dev
      KUBE_TOKEN:
        from_secret: kube_token_dev
      REDIS_PERSISTENCE_ENABLED: "false"
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - bin/deploy.sh $${BRANCH_ENV}
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: pull_request
    depends_on:
      - clone_repos
      - image_to_quay

  # Run Playwright e2e against the deployed PR branch environment
  - name: e2e_tests
    pull: if-not-exists
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    environment:
      SAS_HOF_EMAIL:
        from_secret: SAS_HOF_EMAIL
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - npm install -g n
      - n 24.22.3
      - hash -r
      - node --version
      - yarn install --frozen-lockfile
      - yarn playwright install --with-deps
      - apt-get update && apt-get install -y --no-install-recommends default-jre-headless
      - test -s /root/.dockersock/branch_url.txt || (echo "Missing deployed branch URL at /root/.dockersock/branch_url.txt" && exit 1)
      - rm -rf allure-results allure-report
      - |
        set +e
        CI=true PLAYWRIGHT_BASE_URL="https://$(cat /root/.dockersock/branch_url.txt)" yarn test:e2e
        playwright_exit_code=$?
        yarn allure:generate
        report_exit_code=$?
        set -e

        if [ "$report_exit_code" -ne 0 ]; then
          echo "Allure report generation failed." >&2
        fi
        if [ "$playwright_exit_code" -ne 0 ]; then
          exit "$playwright_exit_code"
        fi
        exit "$report_exit_code"
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: pull_request
    depends_on:
      - deploy_to_branch

  # Generate a short-lived GitHub App installation token for PR Allure report publishing
  - name: generate_github_app_token_for_report
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_ukho
      OUTPUT_TOKEN_FILE: /root/.dockersock/github_app_token_for_report.txt
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: pull_request
      status:
        - success
        - failure
    depends_on:
      - e2e_tests

  # Publish the Allure report to the PR using GitHub App auth
  - name: publish_e2e_report_to_pr
    pull: if-not-exists
    image: alpine:3.21
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - apk add --no-cache bash curl jq
      - test -n "$DRONE_PULL_REQUEST" || (echo "Missing DRONE_PULL_REQUEST. This step only supports pull_request builds." && exit 1)
      - test -n "$DRONE_REPO" || (echo "Missing DRONE_REPO." && exit 1)
      - test -s /root/.dockersock/github_app_token_for_report.txt || (echo "Missing GitHub App token file from generate_github_app_token_for_report step." && exit 1)
      - export GITHUB_APP_TOKEN="$(cat /root/.dockersock/github_app_token_for_report.txt)"
      - bash bin/publish_e2e_test_report.sh
      - rm -f /root/.dockersock/github_app_token_for_report.txt
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: pull_request
      status:
        - success
        - failure
    depends_on:
      - generate_github_app_token_for_report

  # Deploy to Master UAT environment
  - name: deploy_to_uat
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER:
        from_secret: kube_server_dev
      KUBE_TOKEN:
        from_secret: kube_token_dev
      REDIS_PERSISTENCE_ENABLED: "false"
    commands:
      - bin/deploy.sh $${UAT_ENV}
    when:
      branch:
        <<: *include_default_branch
      event: push
    depends_on:
      - clone_repos
      - image_to_quay

  # Get pull request branch so correct PR UAT environment is torn down in the tear_down_branch step that follows
  - name: get_pr_branch
    pull: if-not-exists
    image: drone/cli:alpine@sha256:14409f7f7247befb9dd2effdb2f61ac40d1f5fbfb1a80566cf6f2f8d21f3be11
    environment:
      DRONE_SERVER:
        from_secret: drone_server
      DRONE_TOKEN:
        from_secret: drone_token
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - drone build info $GIT_REPO $DRONE_BUILD_NUMBER --format {{.Message}} | grep -o '[^ ]\+$' -m1 | sed 's|UKHomeOffice/||g' | tr '[:upper:]' '[:lower:]' | tr '/' '-' > /root/.dockersock/branch_name.txt
    when:
      branch:
        <<: *include_default_branch
      event: push

  # Tear down pull request UAT environment
  - name: tear_down_branch
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER:
        from_secret: kube_server_dev
      KUBE_TOKEN:
        from_secret: kube_token_dev
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - bin/deploy.sh tear_down
    when:
      branch:
        <<: *include_default_branch
      event: push
    depends_on:
      - get_pr_branch
      - deploy_to_uat

  # Deploy to Production environment
  - name: deploy_to_stg
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER:
        from_secret: kube_server_stg
      KUBE_TOKEN:
        from_secret: kube_token_stg
      REDIS_PERSISTENCE_ENABLED: "true"
      REDIS_PERSISTENCE_SIZE: 1Gi
    commands:
      - bin/deploy.sh $${STG_ENV}
    when:
      branch:
        <<: *include_default_branch
      event: push
    depends_on:
      - clone_repos
      - image_to_quay

  # Checks a build being promoted has passed, is on master which effectively means a healthy build on Staging
  - name: sanity_check_build_prod
    pull: if-not-exists
    image: drone/cli:alpine@sha256:14409f7f7247befb9dd2effdb2f61ac40d1f5fbfb1a80566cf6f2f8d21f3be11
    environment:
      DRONE_SERVER:
        from_secret: drone_server
      DRONE_TOKEN:
        from_secret: drone_token
    commands:
      - bin/sanity_check_build.sh
    when:
      target: PROD
      event: promote

  - name: generate_github_app_token_for_clone_prod
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_hof
      OUTPUT_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone_prod.txt
    when:
      target: PROD
      event: promote
    depends_on:
      - sanity_check_build_prod

  - name: clone_repos_prod
    <<: *clone_repos_step
    environment:
      CLONE_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone_prod.txt
      CLONE_TOKEN_MISSING_MESSAGE: Missing GitHub App token file for PROD clone step.
    commands:
      - test -s "$CLONE_TOKEN_FILE" || (echo "$CLONE_TOKEN_MISSING_MESSAGE" && exit 1)
      - export GITHUB_TOKEN="$(cat "$CLONE_TOKEN_FILE")"
      - git clone https://x-access-token:$${GITHUB_TOKEN}@github.com/UKHomeOfficeForms/hof-services-config.git
      - find hof-services-config/* | grep -v $HOF_CONFIG | grep -v 'infrastructure' | xargs rm -rf
      - rm -f "$CLONE_TOKEN_FILE"
    when:
      target: PROD
      event: promote
    depends_on:
      - generate_github_app_token_for_clone_prod

    # Deploy to Production environment
  - name: deploy_to_prod
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER:
        from_secret: kube_server_prod
      KUBE_TOKEN:
        from_secret: kube_token_prod
      REDIS_PERSISTENCE_ENABLED: "true"
      REDIS_PERSISTENCE_SIZE: 10Gi
    commands:
      - bin/deploy.sh $${PROD_ENV}
    when:
      target: PROD
      event: promote
    depends_on:
      - clone_repos_prod

# CRON job step that tears down our pull request BRANCH environments
  - name: cron_tear_down
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER:
        from_secret: kube_server_dev
      KUBE_TOKEN:
        from_secret: kube_token_dev
    commands:
      - bin/clean_up.sh $${BRANCH_ENV}
    when:
      cron: tear_down_pr_envs
      event: cron

  # CRON job steps that runs security scans using Trivy
  - name: generate_github_app_token_for_clone_cron
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_hof
      OUTPUT_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone_cron.txt
    when:
      cron: security_scans
      event: cron

  - name: cron_clone_repos
    <<: *clone_repos_step
    environment:
      CLONE_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone_cron.txt
      CLONE_TOKEN_MISSING_MESSAGE: Missing GitHub App token file for CRON clone step.
    commands:
      - test -s "$CLONE_TOKEN_FILE" || (echo "$CLONE_TOKEN_MISSING_MESSAGE" && exit 1)
      - export GITHUB_TOKEN="$(cat "$CLONE_TOKEN_FILE")"
      - git clone https://x-access-token:$${GITHUB_TOKEN}@github.com/UKHomeOfficeForms/hof-services-config.git
      - find hof-services-config/* | grep -v $HOF_CONFIG | grep -v 'infrastructure' | xargs rm -rf
      - rm -f "$CLONE_TOKEN_FILE"
    when:
      cron: security_scans
      event: cron
    depends_on:
      - generate_github_app_token_for_clone_cron

  - name: cron_build_image
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind
    commands:
      # wait for docker service to be up before running docker build
      - /usr/local/bin/wait
      - docker build --no-cache -t $${IMAGE_REPO}:$${DRONE_COMMIT_SHA} .
    volumes:
      - name: dockersock
        path: /var/run
    when:
      cron: security_scans
      event: cron
    depends_on:
      - cron_clone_repos

  - name: cron_trivy_scan_image_os
    <<: *trivy-client-image
    environment:
      IMAGE_NAME: *node_image_name
      SEVERITY: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --dependency-tree
      FAIL_ON_DETECTION: true
      IGNORE_UNFIXED: false
      ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    when:
      cron: security_scans
      event: cron
    depends_on:
      - cron_clone_repos

  - name: cron_trivy_scan_node_packages
    <<: *trivy-client-image
    environment:
      IMAGE_NAME: gro-form:${DRONE_COMMIT_SHA}
      SERVICE_URL: https://acp-trivy-helm.acp-trivy.svc.cluster.local:443
      SEVERITY: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --dependency-tree
      FAIL_ON_DETECTION: true
      IGNORE_UNFIXED: false
      ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    when:
      cron: security_scans
      event: cron
      status: [success, failure]
    depends_on:
      - cron_build_image

  # Slack notification upon a CRON job fail
  - name: cron_notify_slack_tear_down_pr_envs
    pull: if-not-exists
    image: plugins/slack:1.4.1
    settings:
      channel: sas-hof-build-notify
      failure: ignore
      template: >
            *✘ {{ uppercasefirst build.status }}*: CRON Job `tear_down_pr_envs` for * GRO Forms* has failed.

            Branch <https://github.com/{{ repo.owner }}/{{ repo.name }}/commits/{{ build.branch }}|{{build.branch}}> | Commit <https://github.com/{{ repo.owner }}/{{ repo.name }}/commit/{{ build.commit }}|{{ truncate build.commit 8 }}>
            
            *Build <{{build.link}}|#{{build.number}}>*
      webhook:
        from_secret: slack_sas_hof_build_notify_webhook
      username: Drone_CI
    when:
      cron: tear_down_pr_envs
      event: cron
      status: failure
    depends_on:
      - cron_tear_down

  - name: cron_notify_slack_security_scans
    pull: if-not-exists
    image: plugins/slack:1.4.1
    settings:
      channel: sas-hof-security
      failure: ignore
      template: >
          *✘ {{ uppercasefirst build.status }}*: Cron job `security_scans` has failed for * GRO Forms* has failed.

            Branch <https://github.com/{{ repo.owner }}/{{ repo.name }}/commits/{{ build.branch }}|{{build.branch}}> | Commit <https://github.com/{{ repo.owner }}/{{ repo.name }}/commit/{{ build.commit }}|{{ truncate build.commit 8 }}>
            
            *Build <{{build.link}}|#{{build.number}}>*
      username: Drone_CI
      webhook:
        from_secret: slack_sas_hof_security_webhook
    when:
      cron: security_scans
      event: cron
      status:
        - failure
    depends_on:
      - cron_trivy_scan_image_os
      - cron_trivy_scan_node_packages

  # Run nightly Playwright E2E tests against the configured GRO UAT environment
  - name: cron_nightly_e2e_tests
    pull: if-not-exists
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    environment:
      SAS_HOF_EMAIL:
        from_secret: SAS_HOF_EMAIL
      NIGHTLY_E2E_BASE_URL:
        from_secret: NIGHTLY_E2E_BASE_URL
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - rm -f /root/.dockersock/nightly-playwright-run-output.txt /root/.dockersock/nightly-playwright-report.json /root/.dockersock/nightly-playwright-summary.txt /root/.dockersock/nightly-playwright-summary.json /root/.dockersock/nightly-playwright-exit-code.txt /root/.dockersock/nightly-allure-report-url.txt
      - rm -rf allure-results allure-report
      - npm install -g n
      - n 24.22.3
      - hash -r
      - node --version
      - yarn install --frozen-lockfile
      - yarn playwright install --with-deps
      - apt-get update && apt-get install -y --no-install-recommends default-jre-headless
      - |
        test -n "$NIGHTLY_E2E_BASE_URL" || (echo "Missing NIGHTLY_E2E_BASE_URL environment value." && exit 1)

        case "$NIGHTLY_E2E_BASE_URL" in
          http://*|https://*) base_url="$NIGHTLY_E2E_BASE_URL" ;;
          *) base_url="https://$NIGHTLY_E2E_BASE_URL" ;;
        esac
        echo "Using PLAYWRIGHT_BASE_URL=$base_url"

        run_output_path="/root/.dockersock/nightly-playwright-run-output.txt"
        json_output_path="/root/.dockersock/nightly-playwright-report.json"
        summary_output_path="/root/.dockersock/nightly-playwright-summary.txt"
        summary_json_path="/root/.dockersock/nightly-playwright-summary.json"
        exit_code_path="/root/.dockersock/nightly-playwright-exit-code.txt"

        set +e
        yarn bddgen
        bddgen_exit_code=$?
        status_write_exit_code=0
        if [ "$bddgen_exit_code" -eq 0 ]; then
          CI=true PLAYWRIGHT_BASE_URL="$base_url" PLAYWRIGHT_JSON_OUTPUT_NAME="$json_output_path" \
            yarn playwright test --reporter=line,json,allure-playwright > "$run_output_path" 2>&1
          playwright_exit_code=$?
          printf '%s:%s\n' "$DRONE_BUILD_NUMBER" "$playwright_exit_code" > "$exit_code_path" || status_write_exit_code=$?
        else
          playwright_exit_code=unavailable
          printf '%s:unavailable\n' "$DRONE_BUILD_NUMBER" > "$exit_code_path" || status_write_exit_code=$?
        fi
        if [ -s "$run_output_path" ]; then
          tail -n 60 "$run_output_path"
        fi
        node bin/summarise_playwright_report.js \
          "$json_output_path" "$summary_output_path" "$playwright_exit_code" "$summary_json_path" "$DRONE_BUILD_NUMBER"
        summary_exit_code=$?
        report_exit_code=1
        if [ -d allure-results ] && find allure-results -name '*-result.json' -print -quit | grep -q .; then
          yarn allure:generate
          report_exit_code=$?
        else
          echo "No Allure results were produced; report cannot be generated." >&2
        fi
        if [ "$report_exit_code" -ne 0 ]; then
          echo "Allure report generation failed." >&2
        fi

        set -e
        if [ "$bddgen_exit_code" -ne 0 ]; then
          exit "$bddgen_exit_code"
        fi
        if [ "$playwright_exit_code" != "0" ]; then
          case "$playwright_exit_code" in
            ''|*[!0-9]*) exit 1 ;;
            *) exit "$playwright_exit_code" ;;
          esac
        fi
        if [ "$status_write_exit_code" -ne 0 ] || [ "$summary_exit_code" -ne 0 ] || [ "$report_exit_code" -ne 0 ]; then
          exit 1
        fi
    when:
      cron: nightly_e2e_playwright
      event: cron

  # Generate a short-lived GitHub App installation token for nightly report publishing
  - name: cron_generate_github_app_token
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_ukho
      OUTPUT_TOKEN_FILE: /root/.dockersock/github_app_token.txt
    when:
      cron: nightly_e2e_playwright
      event: cron
      status: [success, failure]
    depends_on:
      - cron_nightly_e2e_tests

  # Upload the nightly single-file Allure report so Slack can link to it
  - name: cron_publish_nightly_allure_report
    pull: if-not-exists
    image: alpine:3.21
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - apk add --no-cache bash curl jq
      - rm -f /root/.dockersock/nightly-allure-report-url.txt
      - export DRONE_REPO="$${DRONE_REPO:-$GIT_REPO}"
      - test -n "$DRONE_REPO" || (echo "Missing repository slug (DRONE_REPO/GIT_REPO)." && exit 1)
      - test -s /root/.dockersock/github_app_token.txt || (echo "Missing GitHub App token file from cron_generate_github_app_token step." && exit 1)
      - export GITHUB_APP_TOKEN="$(cat /root/.dockersock/github_app_token.txt)"
      - trap 'rm -f /root/.dockersock/github_app_token.txt' EXIT
      - unset DRONE_PULL_REQUEST
      - REPORT_URL_FILE=/root/.dockersock/nightly-allure-report-url.txt bash bin/publish_e2e_test_report.sh
    when:
      cron: nightly_e2e_playwright
      event: cron
      status: [success, failure]
    depends_on:
      - cron_generate_github_app_token

  # Slack notification for nightly E2E cron runs
  - name: cron_notify_slack_nightly_e2e
    pull: if-not-exists
    image: alpine:3.21
    environment:
      SLACK_WEBHOOK:
        from_secret: slack_sas_hof_e2e_tests_webhook
      NIGHTLY_E2E_BASE_URL:
        from_secret: NIGHTLY_E2E_BASE_URL
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - apk add --no-cache curl jq
      - test -n "$SLACK_WEBHOOK" || (echo "Missing slack_sas_hof_e2e_tests_webhook secret." && exit 1)
      - |
        exit_code_path="/root/.dockersock/nightly-playwright-exit-code.txt"
        summary_json_path="/root/.dockersock/nightly-playwright-summary.json"
        status_build=""
        saved_exit_code=""
        status_data_valid=false
        if [ -s "$exit_code_path" ]; then
          IFS=: read -r status_build saved_exit_code < "$exit_code_path"
          if [ "$status_build" = "$DRONE_BUILD_NUMBER" ] &&
            printf '%s\n' "$saved_exit_code" | grep -Eq '^(0|[1-9][0-9]{0,2})$' &&
            [ "$saved_exit_code" -le 255 ]; then
            status_data_valid=true
          fi
        fi

        summary_data_valid=false
        if [ "$status_data_valid" = true ] && [ -s "$summary_json_path" ] &&
          jq -e --arg build "$DRONE_BUILD_NUMBER" --argjson exit_code "$saved_exit_code" \
            '.valid == true and .buildNumber == $build and .playwrightExitCode == $exit_code and
             ((.testStatus == "Passed" and .playwrightExitCode == 0) or
              (.testStatus == "Failed" and .playwrightExitCode != 0)) and
             (.counts.expected | type == "number" and . >= 0) and
             (.counts.unexpected | type == "number" and . >= 0) and
             (.counts.flaky | type == "number" and . >= 0) and
             (.counts.skipped | type == "number" and . >= 0) and
             (.percentages.expected | type == "number" and . >= 0) and
             (.percentages.unexpected | type == "number" and . >= 0) and
             (.percentages.flaky | type == "number" and . >= 0) and
             (.percentages.skipped | type == "number" and . >= 0) and
             (.reported == (.counts.expected + .counts.unexpected + .counts.flaky + .counts.skipped)) and
             (.discovered | type == "number" and . > 0)' \
            "$summary_json_path" >/dev/null 2>&1; then
          summary_data_valid=true
        fi

        if [ "$summary_data_valid" = true ]; then
          results="$(jq -r '
            [
              "Passed: \(.percentages.expected)% No Of Tests: \(.counts.expected)",
              "Failed: \(.percentages.unexpected)% No Of Tests: \(.counts.unexpected)",
              "Flaky: \(.percentages.flaky)% No Of Tests: \(.counts.flaky)",
              "Skipped: \(.percentages.skipped)% No Of Tests: \(.counts.skipped)",
              "Total Results Reported: \(.reported) of \(.discovered)"
            ] | join("\n")
          ' "$summary_json_path")"
        else
          invalid_reason="Playwright status or results are missing, invalid, or belong to another build"
          if [ -s "$summary_json_path" ] &&
            jq -e --arg build "$DRONE_BUILD_NUMBER" '.buildNumber == $build and (.issues | type == "array")' \
              "$summary_json_path" >/dev/null 2>&1; then
            summary_issues="$(jq -r '.issues | join("; ")' "$summary_json_path")"
            if [ -n "$summary_issues" ]; then
              invalid_reason="$summary_issues"
            fi
          fi
          results="$(printf '%s\n' \
            'Passed: N/A No Of Tests: N/A' \
            'Failed: N/A No Of Tests: N/A' \
            'Flaky: N/A No Of Tests: N/A' \
            'Skipped: N/A No Of Tests: N/A' \
            'Total Results Reported: unknown' \
            "Results: INVALID ($invalid_reason)")"
        fi

        test_status="Failed"
        if [ "$status_data_valid" = true ] && [ "$summary_data_valid" = true ] &&
          [ "$saved_exit_code" -eq 0 ] &&
          jq -e '.testStatus == "Passed"' "$summary_json_path" >/dev/null 2>&1; then
          test_status="Passed"
        fi
        attachment_color="danger"
        if [ "$test_status" = "Passed" ]; then
          attachment_color="good"
        fi

        report_url="${DRONE_BUILD_LINK:-}"
        report_link="<$report_url|View Drone Build> (Allure report unavailable; see build logs)"
        if [ -s /root/.dockersock/nightly-allure-report-url.txt ]; then
          report_url="$(head -n 1 /root/.dockersock/nightly-allure-report-url.txt)"
          report_link="<$report_url|View Test Report> (downloads the single-file HTML report)"
        fi

        case "$NIGHTLY_E2E_BASE_URL" in
          http://*|https://*) environment="$NIGHTLY_E2E_BASE_URL" ;;
          "") environment="unavailable" ;;
          *) environment="https://$NIGHTLY_E2E_BASE_URL" ;;
        esac

        preview="$(printf '%s\n' \
          '****************** Start of GRO Test Report ******************' \
          'Nightly Playwright Tests' \
          "Status: $test_status")"
        full_report="$(printf '%s\n' \
          'Service Name: GRO' \
          'Service Abbreviation: GRO' \
          "Status: ${DRONE_BUILD_STATUS:-unknown}" \
          "Branch: ${DRONE_BRANCH:-unknown}" \
          "Environment: $environment" \
          "Build: <${DRONE_BUILD_LINK:-unavailable}|#${DRONE_BUILD_NUMBER:-unknown}>" \
          "Test Status: $test_status" \
          '' \
          'Test Results:' \
          "$results" \
          "$report_link" \
          '****************** End of GRO Test Report ******************')"
        payload=$(jq -n \
          --arg preview "$preview" \
          --arg report "$full_report" \
          --arg color "$attachment_color" \
          '{
            text: $preview,
            mrkdwn: false,
            attachments: [{
              color: $color,
              fallback: $preview,
              text: $report,
              mrkdwn_in: ["text"]
            }]
          }')
        http_code=$(curl -sS -o /tmp/slack_response.txt -w "%{http_code}" \
          -X POST \
          -H "Content-type: application/json" \
          --data "$payload" \
          "$SLACK_WEBHOOK")
        echo "Slack webhook HTTP status: $http_code"
        echo "Slack webhook response body:"
        cat /tmp/slack_response.txt
        test "$http_code" = "200" || (echo "Slack webhook call failed" && exit 1)
    when:
      cron: nightly_e2e_playwright
      event: cron
      status:
        - success
        - failure
    depends_on:
      - cron_publish_nightly_allure_report

services:
  - name: docker
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind

  # Redis session setup in background so integration tests can run
  - name: session
    image: redis
    volumes:
      - name: dockersock
        path: /var/run

volumes:
  - name: dockersock
    temp: {}

